name: Build Android APK (zip)
on: [workflow_dispatch]
permissions:
  contents: write
env:
  APP_NAME: "فرار از دلقک"
  APK_NAME: "coin-runner"
  BUILD_CODE: "2"
jobs:
  apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          (command -v unzip >/dev/null) || (apt-get update -qq && apt-get install -y -qq unzip)
          ls -la
          Z=$(ls *.zip | head -1)
          echo "zip: $Z"
          mkdir -p tmp_unz
          unzip -q -o "$Z" -d tmp_unz
          P=$(dirname "$(find tmp_unz -name project.godot | head -1)")
          echo "project dir: $P"
          mv "$P" game
          if [ -s update_key.pub ]; then cp update_key.pub game/update_key.pub; echo "update key installed"; else echo "NO update_key.pub"; fi
          sed -i "s|^package/name=.*|package/name=\"$APP_NAME\"|" game/export_presets.cfg
          sed -i "s|^config/name=.*|config/name=\"$APP_NAME\"|" game/project.godot
          sed -i "s|^const BUILD := .*|const BUILD := $BUILD_CODE|" game/scripts/updater.gd
          sed -i "s|^version/code=.*|version/code=$BUILD_CODE|" game/export_presets.cfg
          grep -n "^const BUILD" game/scripts/updater.gd
          grep -n "package/name\|config/name\|version/code" game/export_presets.cfg game/project.godot
          ls game
      - name: Prepare
        working-directory: game
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot build
          ls /root/.local/share/godot/export_templates/ || true
          V=$(ls /root/.local/share/godot/export_templates | head -1)
          echo "templates: $V"
          cp -r "/root/.local/share/godot/export_templates/$V" ~/.local/share/godot/export_templates/
          if [ ! -f /root/debug.keystore ]; then keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12; fi
          ls -la /root/debug.keystore
          keytool -keyalg RSA -keysize 2048 -genkeypair -alias clownrun -keypass clownrun123 -keystore build/release.keystore -storepass clownrun123 -dname "CN=ClownRun,O=ClownRun,C=US" -validity 9999 -deststoretype pkcs12
          godot -e --headless --quit || true
          F=$(ls ~/.config/godot/editor_settings-4*.tres | head -1)
          J=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          echo "java: $J"
          echo "sdk:" && ls /usr/lib/android-sdk || true
          echo 'export/android/debug_keystore = "/root/debug.keystore"' >> "$F"
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$F"
          echo 'export/android/debug_keystore_pass = "android"' >> "$F"
          echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> "$F"
          echo "export/android/java_sdk_path = \"$J\"" >> "$F"
          godot --headless --import || true
      - name: Export APK
        working-directory: game
        run: godot --headless --export-debug "Android Public" "build/${APK_NAME}.apk"
      - name: Export patch
        working-directory: game
        run: godot --headless --export-pack "Patch" build/patch.pck
      - uses: actions/upload-artifact@v4
        with:
          name: coin-runner-build
          path: |
            game/build/${{ env.APK_NAME }}.apk
            game/build/patch.pck
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            game/build/${{ env.APK_NAME }}.apk
            game/build/patch.pck
