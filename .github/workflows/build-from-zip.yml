
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y curl unzip

      - name: Extract game
        run: unzip -q godot_project.zip

      - name: Install export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fL "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Prepare Android
        working-directory: godot_project
        run: |
          mkdir -p ~/.config/godot build
          rm -f "$HOME/debug.keystore"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          godot -e --headless --quit
          F=$(ls ~/.config/godot/editor_settings-4*.tres | head -1)
          echo "export/android/debug_keystore = \"$HOME/debug.keystore\"" >> "$F"
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$F"
          echo 'export/android/debug_keystore_pass = "android"' >> "$F"
          echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> "$F"
          echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$F"

      - name: Build APK
        working-directory: godot_project
        run: godot --headless --export-debug "Android Public" build/coin-runner.apk

      - name: Build Patch
        working-directory: godot_project
        run: godot --headless --export-pack "Patch" build/patch.pck

      - uses: actions/upload-artifact@v4
        with:
          name: coin-runner-build
          path: |
            godot_project/build/coin-runner.apk
            godot_project/build/patch.pck

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            godot_project/build/coin-runner.apk
            godot_project/build/patch.pck
